name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      SUPABASE_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@v5

      # Pinned to the CLI version the migrations/types were generated with.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # Only the services the migrations and pgTAP tests need. stdin is closed so
      # the CLI can never wait on a prompt.
      - name: Start Supabase
        timeout-minutes: 8
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,supavisor < /dev/null

      - name: Apply migrations from scratch
        run: supabase db reset

      - name: Database tests (pgTAP)
        run: supabase test db

      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local > src/server/db/database.types.ts
          git diff --exit-code -- src/server/db/database.types.ts

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # The host app reads the local stack's keys from .env.local, like a developer would.
      - name: Point the app at local Supabase
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } > .env.local

      - name: Playwright smoke (host app against local Supabase)
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
